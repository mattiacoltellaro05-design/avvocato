<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Tribunal Difensore</title>

<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">

<style>

:root{
  --bg:#111214;
  --card:#1b1d21;
  --card2:#24262b;
  --border:#343841;
  --text:#f2f2f2;
  --muted:#a7adb7;
  --primary:#5ab1bb;
  --accent:#7d8dff;

  --radius:22px;

  --safe-top:max(env(safe-area-inset-top), 12px);
  --safe-bottom:max(env(safe-area-inset-bottom), 12px);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:'Satoshi',sans-serif;
}

body{
  overflow:hidden;
}

/* APP */

.app{
  height:100dvh;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:
    radial-gradient(circle at top left,
      rgba(90,177,187,.15),
      transparent 35%),
    radial-gradient(circle at top right,
      rgba(125,141,255,.15),
      transparent 35%),
    var(--bg);
}

/* HEADER */

.header{
  padding:
    calc(var(--safe-top) + 10px)
    16px
    14px;

  flex-shrink:0;
}

.topbar{
  background:rgba(27,29,33,.92);
  border:1px solid rgba(255,255,255,.06);
  border-radius:28px;

  padding:16px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  backdrop-filter:blur(20px);
}

.brand{
  display:flex;
  align-items:center;
  gap:14px;
}

.logo{
  width:48px;
  height:48px;
  border-radius:16px;

  background:linear-gradient(135deg,var(--primary),var(--accent));

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:20px;
  font-weight:900;
}

.title small{
  display:block;
  color:var(--muted);
  font-size:12px;
  letter-spacing:.08em;
  text-transform:uppercase;
}

.title strong{
  font-size:20px;
}

.stats{
  margin-top:12px;

  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.stat{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:12px;
}

.stat span{
  display:block;
  font-size:11px;
  color:var(--muted);
  margin-bottom:6px;
}

.stat strong{
  font-size:15px;
}

/* CONTENT */

.content{
  flex:1;
  overflow-y:auto;

  padding:0 16px 140px;

  -webkit-overflow-scrolling:touch;
}

.screen{
  display:none;
  animation:fade .25s ease;
}

.screen.active{
  display:block;
}

@keyframes fade{
  from{
    opacity:0;
    transform:translateY(8px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.section-title{
  margin:8px 0 18px;
}

.section-title h2{
  margin:0;
  font-size:28px;
}

.section-title p{
  margin:6px 0 0;
  color:var(--muted);
  font-size:14px;
}

/* CARDS */

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:28px;
  padding:18px;
  margin-bottom:16px;
}

.badge{
  display:inline-flex;
  align-items:center;
  padding:6px 12px;
  border-radius:999px;

  background:rgba(90,177,187,.12);
  color:var(--primary);

  font-size:12px;
  font-weight:700;
}

.case-title{
  margin:14px 0 4px;
  font-size:22px;
  font-weight:800;
}

.muted{
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  margin-top:14px;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:18px;
}

button{
  border:none;
  font:inherit;
}

.btn{
  min-height:50px;
  border-radius:18px;
  font-weight:800;
}

.btn-primary{
  background:linear-gradient(135deg,var(--primary),var(--accent));
  color:white;
}

.btn-secondary{
  background:var(--card2);
  color:var(--text);
}

/* TRIAL */

.assistant{
  background:linear-gradient(
    180deg,
    rgba(90,177,187,.12),
    var(--card)
  );

  border:1px solid var(--border);
  border-radius:24px;
  padding:16px;
  margin-bottom:14px;
}

.assistant small{
  color:var(--primary);
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.08em;
}

.dialog{
  margin-top:12px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.bubble{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:22px;
  padding:16px;
}

.bubble.prosecution{
  border-color:rgba(255,100,140,.35);
}

.bubble.defense{
  border-color:rgba(90,177,187,.35);
}

.bubble small{
  display:block;
  margin-bottom:8px;
  color:var(--muted);
  text-transform:uppercase;
  font-size:11px;
  letter-spacing:.08em;
}

.choices{
  display:grid;
  gap:10px;
  margin-top:18px;
}

.choice{
  background:var(--card2);
  border:1px solid var(--border);
  border-radius:22px;
  padding:16px;
  text-align:left;
}

.choice strong{
  display:block;
  margin-bottom:6px;
}

/* NAVBAR */

.navbar{
  position:sticky;
  bottom:0;

  padding:
    12px
    16px
    calc(var(--safe-bottom) + 8px);

  background:linear-gradient(
    to top,
    rgba(17,18,20,.98),
    rgba(17,18,20,.82)
  );

  backdrop-filter:blur(18px);
}

.nav{
  background:rgba(27,29,33,.96);

  border:1px solid rgba(255,255,255,.06);

  border-radius:26px;

  display:grid;
  grid-template-columns:repeat(3,1fr);

  padding:8px;
}

.nav button{
  min-height:58px;
  border-radius:18px;

  background:transparent;
  color:var(--muted);

  font-weight:700;
}

.nav button.active{
  background:linear-gradient(
    135deg,
    rgba(90,177,187,.18),
    rgba(125,141,255,.16)
  );

  color:white;
}

/* iPhone */

@supports (-webkit-touch-callout:none){

  .content{
    overscroll-behavior-y:contain;
  }

}

</style>
</head>

<body>

<div class="app">

  <div class="header">

    <div class="topbar">
      <div class="brand">
        <div class="logo">⚖️</div>

        <div class="title">
          <small>Studio Penale</small>
          <strong>Tribunal Difensore</strong>
        </div>
      </div>
    </div>

    <div class="stats">
      <div class="stat">
        <span>Fama</span>
        <strong id="fame">12</strong>
      </div>

      <div class="stat">
        <span>Soldi</span>
        <strong id="money">€2400</strong>
      </div>

      <div class="stat">
        <span>Vinti</span>
        <strong id="wins">0</strong>
      </div>

      <div class="stat">
        <span>Giorno</span>
        <strong id="day">1</strong>
      </div>
    </div>

  </div>

  <div class="content">

    <!-- HOME -->

    <section class="screen active" id="home">

      <div class="section-title">
        <h2>Casi disponibili</h2>
        <p>Ogni scelta cambia reputazione e carriera.</p>
      </div>

      <div id="cases"></div>

    </section>

    <!-- TRIAL -->

    <section class="screen" id="trial">

      <div class="section-title">
        <h2 id="trialName">Processo</h2>
        <p id="trialCharge">Apri un caso per iniziare.</p>
      </div>

      <div class="assistant">
        <small>Assistente</small>
        <div id="assistantText">
          Seleziona un caso dalla home.
        </div>
      </div>

      <div class="dialog" id="dialog"></div>

      <div class="choices">

        <button class="choice" onclick="play('evidence')">
          <strong>Mostra prova</strong>
          <span class="muted">Colpisci con i documenti.</span>
        </button>

        <button class="choice" onclick="play('objection')">
          <strong>Obiezione</strong>
          <span class="muted">Interrompi la procura.</span>
        </button>

        <button class="choice" onclick="play('pressure')">
          <strong>Controesame</strong>
          <span class="muted">Metti pressione al testimone.</span>
        </button>

      </div>

    </section>

    <!-- STUDIO -->

    <section class="screen" id="studio">

      <div class="section-title">
        <h2>Studio</h2>
        <p>La tua reputazione nel foro.</p>
      </div>

      <div class="card">
        <h3>Ultimo risultato</h3>
        <p class="muted" id="lastResult">
          Nessun verdetto emesso.
        </p>
      </div>

    </section>

  </div>

  <!-- NAV -->

  <div class="navbar">

    <div class="nav">

      <button class="active" onclick="openScreen('home',this)">
        Home
      </button>

      <button onclick="openScreen('trial',this)">
        Aula
      </button>

      <button onclick="openScreen('studio',this)">
        Studio
      </button>

    </div>

  </div>

</div>

<script>

const state = {
  fame:12,
  money:2400,
  wins:0,
  day:1,
  current:null,
  round:0
};

const cases = [
{
  id:'rossi',
  title:'Il gioielliere Rossi',
  charge:'Ricettazione',
  reward:1800,

  assistant:[
    'Punta sulla buona fede e sui pagamenti tracciati.',
    'Ora la procura attaccherà il prezzo sospetto.'
  ],

  rounds:[
    {
      prosecution:'Il prezzo era troppo basso.',
      defense:{
        evidence:'Produco bonifico e contratto.',
        objection:'Manca un vero parametro di mercato.',
        pressure:'Il teste non ha verificato i listini.'
      }
    },
    {
      prosecution:'L’imputato doveva sospettare.',
      defense:{
        evidence:'Le chat mostrano garanzie di regolarità.',
        objection:'Sono solo supposizioni.',
        pressure:'Il negozio aveva fatture regolari.'
      }
    }
  ]
}
];

function renderCases(){

  const root = document.getElementById('cases');

  root.innerHTML = '';

  cases.forEach(c=>{

    root.innerHTML += `
      <div class="card">

        <span class="badge">Caso</span>

        <div class="case-title">
          ${c.title}
        </div>

        <div class="muted">
          ${c.charge}
        </div>

        <div class="row">
          <div class="muted">Parcella</div>
          <strong>€${c.reward}</strong>
        </div>

        <div class="actions">

          <button class="btn btn-primary"
          onclick="startCase('${c.id}')">
            Accetta
          </button>

          <button class="btn btn-secondary">
            Rifiuta
          </button>

        </div>

      </div>
    `;

  });

}

function openScreen(id,btn){

  document.querySelectorAll('.screen')
    .forEach(s=>s.classList.remove('active'));

  document.getElementById(id)
    .classList.add('active');

  document.querySelectorAll('.nav button')
    .forEach(b=>b.classList.remove('active'));

  btn.classList.add('active');

}

function startCase(id){

  const c = cases.find(x=>x.id===id);

  state.current = c;
  state.round = 0;

  document.getElementById('trialName')
    .textContent = c.title;

  document.getElementById('trialCharge')
    .textContent = c.charge;

  document.getElementById('assistantText')
    .textContent = c.assistant[0];

  const dialog = document.getElementById('dialog');

  dialog.innerHTML = `
    <div class="bubble prosecution">
      <small>Pubblico Ministero</small>
      ${c.rounds[0].prosecution}
    </div>
  `;

  document.querySelectorAll('.nav button')
    .forEach(b=>b.classList.remove('active'));

  document.querySelectorAll('.nav button')[1]
    .classList.add('active');

  document.querySelectorAll('.screen')
    .forEach(s=>s.classList.remove('active'));

  document.getElementById('trial')
    .classList.add('active');

}

function play(type){

  const c = state.current;

  if(!c) return;

  const round = c.rounds[state.round];

  const dialog = document.getElementById('dialog');

  dialog.innerHTML += `
    <div class="bubble defense">
      <small>Difesa</small>
      ${round.defense[type]}
    </div>
  `;

  state.round++;

  if(state.round >= c.rounds.length){

    dialog.innerHTML += `
      <div class="bubble defense">
        <small>Giudice</small>
        La corte accoglie i dubbi della difesa.
      </div>
    `;

    state.money += c.reward;
    state.wins++;
    state.fame += 6;

    document.getElementById('money')
      .textContent = '€' + state.money;

    document.getElementById('wins')
      .textContent = state.wins;

    document.getElementById('fame')
      .textContent = state.fame;

    document.getElementById('lastResult')
      .textContent =
      `Hai vinto il caso "${c.title}".`;

    return;
  }

  dialog.innerHTML += `
    <div class="bubble prosecution">
      <small>Pubblico Ministero</small>
      ${c.rounds[state.round].prosecution}
    </div>
  `;

  dialog.scrollTop = dialog.scrollHeight;

}

renderCases();

</script>

</body>
</html>
